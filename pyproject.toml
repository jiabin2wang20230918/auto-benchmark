[project]
name = "auto-bench"
version = "0.1.0"
description = "LLM-driven automated benchmark tuning system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openai-agents>=0.8.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "jsonpath-ng>=1.6.0",
]

[project.scripts]
auto-bench = "auto_bench.cli:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/auto_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
